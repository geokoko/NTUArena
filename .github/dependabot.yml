# Dependabot configuration
# Groups all dependency updates into unified PRs per ecosystem.
# - version-updates: batched weekly on Monday
# - security-updates: also grouped (rather than one PR per package)

version: 2
updates:
  # Backend (Node.js)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all-backend-deps:
        applies-to: version-updates
        patterns:
          - "*"
      all-backend-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2

  # Frontend (React)
  - package-ecosystem: "npm"
    directory: "/view"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all-frontend-deps:
        applies-to: version-updates
        patterns:
          - "*"
      all-frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2
