name: Backend Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests (dockerized)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: test
          load: true
          tags: arena-backend-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run backend tests
        run: docker run --rm arena-backend-test:ci
