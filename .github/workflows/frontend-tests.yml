name: Frontend Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: view
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: view/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
        env:
          # chess.js publishes a source map without its referenced TS source.
          GENERATE_SOURCEMAP: 'false'
